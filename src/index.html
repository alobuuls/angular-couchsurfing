<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Couchsurfing</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="preload"
      href="assets/fonts/poiret-one/poiret-one-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/dancing-script/dancing-script-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/material-icons/material-icons.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/material-icons/material-symbols-outlined.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

  <body class="mat-typography">
    <app-root class="app-stl">
      <!-- Initial loading shown while Angular starts -->
      <div class="loading-container">
        <div class="logo-container">
          <i class="fa fa-spin fa-sync"></i>
        </div>

        <h4 id="loading-title" class="loading-title">Loading...</h4>
      </div>
    </app-root>

    <!-- Rotate loading messages while the app is starting -->
    <script>
      const messages = [
        'Starting Couchsurfing...',
        'Preparing your experience...',
        'Loading your adventure...',
        'Loading the app...',
        'Almost ready...',
      ];

      let index = 0;

      const loadingTitle = document.getElementById('loading-title');

      if (loadingTitle) {
        const messageInterval = setInterval(() => {
          // Stop the interval once Angular replaces the initial loading
          if (!document.getElementById('loading-title')) {
            clearInterval(messageInterval);
            return;
          }

          index = (index + 1) % messages.length;
          loadingTitle.textContent = messages[index];
        }, 2000);
      }
    </script>
  </body>
</html>
