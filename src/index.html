<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Couchsurfing</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="preload"
      href="assets/fonts/poiret-one/poiret-one-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/dancing-script/dancing-script-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/material-icons/material-icons.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/material-icons/material-symbols-outlined.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        const root = document.documentElement;
        const theme = localStorage.getItem('theme');
        const palette = localStorage.getItem('themePalette');

        // Apply the saved theme before Angular starts.
        if (theme === 'dark') root.classList.add('dark-theme');

        // Apply the saved palette before displaying the preloader.
        const validPalettes = ['coastal', 'ocean', 'pink', 'lavender'];

        validPalettes.includes(palette) ? root.classList.add(`theme-${palette}`) : root.classList.add('theme-ocean');
      })();
    </script>
  </head>

  <body class="mat-typography">
    <app-root class="app-stl">
      <!-- Initial loading shown while Angular starts -->
      <div class="loading-container">
        <div class="logo-container loading-animation">↻</div>
      </div>
    </app-root>
  </body>
</html>
