<header [class.active]="showNabBar" [class.header-hidden]="!isHeaderVisible && !showNabBar">
  <div class="topbar">
    <!-- LOGO -->
    <a [routerLink]="['/']" class="logo-menu">
      <span class="title-logo-menu">CouchSurfing</span>
    </a>

    <div class="topbar-controls">
      <!-- DARK / LIGHT MODE -->
      <button
        type="button"
        class="control-button btn-theme"
        (click)="toggleTheme()"
        [attr.aria-label]="themeLabel"
        [title]="themeLabel"
      >
        <mat-icon class="material-symbols-outlined" [fontIcon]="themeIcon"></mat-icon>
      </button>

      <!-- COLOR PALETTE SELECTOR -->
      <div class="ctn-selection-theme">
        <button
          type="button"
          class="control-button btn-palette"
          aria-label="Select color palette"
          title="Select color palette"
          [attr.aria-expanded]="showThemeSelection"
          (click)="toggleThemeSelection()"
        >
          <mat-icon
            class="material-symbols-outlined icon-palette"
            [class.active]="showThemeSelection"
            fontIcon="palette"
          ></mat-icon>
        </button>

        <!-- PALETTE DROPDOWN -->
        <div class="tints" [class.active]="showThemeSelection" [attr.aria-hidden]="!showThemeSelection">
          <button
            type="button"
            class="btn-tint ocean"
            aria-label="Ocean Blue palette"
            title="Ocean Blue"
            [class.selected]="currentPalette === 'ocean'"
            [attr.aria-pressed]="currentPalette === 'ocean'"
            (click)="selectPalette('ocean')"
          ></button>

          <button
            type="button"
            class="btn-tint pink"
            aria-label="Pink Blossom palette"
            title="Pink Blossom"
            [class.selected]="currentPalette === 'pink'"
            [attr.aria-pressed]="currentPalette === 'pink'"
            (click)="selectPalette('pink')"
          ></button>

          <button
            type="button"
            class="btn-tint lavender"
            aria-label="Lavender Nomad palette"
            title="Lavender Nomad"
            [class.selected]="currentPalette === 'lavender'"
            [attr.aria-pressed]="currentPalette === 'lavender'"
            (click)="selectPalette('lavender')"
          ></button>

          <button
            type="button"
            class="btn-tint coastal"
            aria-label="Coastal Nomad palette"
            title="Coastal Nomad"
            [class.selected]="currentPalette === 'coastal'"
            [attr.aria-pressed]="currentPalette === 'coastal'"
            (click)="selectPalette('coastal')"
          ></button>
        </div>
      </div>

      <!-- LANGUAGE SELECTOR -->
      <div class="ctn-selection-language">
        <button
          type="button"
          class="control-button btn-language"
          aria-label="Select language"
          title="Select language"
          [attr.aria-expanded]="showLanguageSelection"
          (click)="toggleLanguageSelection()"
        >
          <mat-icon class="material-symbols-outlined" fontIcon="language"></mat-icon>

          <span>{{ currentLanguage | uppercase }}</span>

          <mat-icon class="material-symbols-outlined dropdown-arrow" fontIcon="expand_more"></mat-icon>
        </button>

        <!-- LANGUAGE DROPDOWN -->
        <div class="languages" [class.active]="showLanguageSelection" [attr.aria-hidden]="!showLanguageSelection">
          <button
            type="button"
            class="btn-language-option"
            [class.selected]="currentLanguage === btnLang.selectedLang"
            [attr.aria-pressed]="currentLanguage === btnLang.selectedLang"
            (click)="selectLanguage(btnLang.selectedLang)"
            *ngFor="let btnLang of btnsLang"
          >
            <span class="fi" [ngClass]="'fi-' + btnLang.flag"></span>

            <span class="language-name">
              {{ btnLang.txt }}
            </span>

            <mat-icon
              *ngIf="currentLanguage === btnLang.selectedLang"
              class="material-symbols-outlined selected-icon"
              fontIcon="check"
            ></mat-icon>
          </button>
        </div>
      </div>

      <!-- HAMBURGER BUTTON -->
      <button
        type="button"
        class="hamburger-button"
        (click)="toogleNavBar()"
        [attr.aria-label]="showNabBar ? 'Close navigation menu' : 'Open navigation menu'"
        [attr.aria-expanded]="showNabBar"
      >
        <mat-icon class="material-symbols-outlined" [fontIcon]="showNabBar ? 'close' : 'menu'"></mat-icon>
      </button>
    </div>
  </div>
</header>

<!-- OVERLAY -->
<div class="overlay" [class.active]="showNabBar" (click)="toogleNavBar()"></div>

<!-- SIDE NAVIGATION MENU -->
<nav class="menu" [class.active]="showNabBar" [attr.aria-hidden]="!showNabBar">
  <!-- CLOSE BUTTON -->
  <div class="ctn-btn-menu-close">
    <button type="button" class="btn-menu" aria-label="Close menu" (click)="toogleNavBar()">
      <mat-icon class="material-symbols-outlined" fontIcon="close"></mat-icon>
    </button>
  </div>

  <!-- NAVIGATION LINKS -->
  <ul (click)="toogleNavBar()">
    <li routerLinkActive="active">
      <a [routerLink]="['/home']">
        <mat-icon fontIcon="home"></mat-icon>
        {{ 'MENU.HOME' | translate }}
      </a>
    </li>

    <li routerLinkActive="active">
      <a [routerLink]="['/guests']">
        <mat-icon fontIcon="diversity_1"></mat-icon>
        {{ 'MENU.GUESTS' | translate }}
      </a>
    </li>
  </ul>
</nav>
