<div class="map-progress">
  <div class="ctn-close-icon">
    <label>
      <mat-icon>close</mat-icon>
      <input type="checkbox" id="close-progress-map" />
    </label>
  </div>

  <!-- Global -->
  <sh-progress-bar
    *ngFor="let p of progressBars"
    [continent]="p"
    [visitedCountriesCount]="visitedCount(p)"
    [totalCountriesCount]="totalCount(p)"
    [visitedCountriesPercentage]="visitedPercentage(p)"
  />
</div>

<div class="map-wrapper">
  <div #mapCtn id="guests-map" class="map"></div>
</div>
