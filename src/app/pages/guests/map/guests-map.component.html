<div class="map-wrapper">
  <!-- COUNTRIES PROGRESS -->
  <div class="map-progress">
    <div class="map-progress-header">
      <span class="map-progress-label">
        {{ 'MAP.COUNTRIES_VISITED' | translate }}
      </span>

      <strong class="map-progress-count"> {{ visitedCountriesCount }}/{{ totalCountriesCount }} </strong>
    </div>

    <div
      class="map-progress-track"
      role="progressbar"
      [attr.aria-valuenow]="visitedCountriesPercentage"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <div class="map-progress-fill" [style.width.%]="visitedCountriesPercentage"></div>
    </div>

    <div class="map-progress-percentage">{{ visitedCountriesPercentage }}%</div>
  </div>

  <div #mapCtn id="guests-map" class="map"></div>
</div>
