<!-- Group Type (solo en Create) -->
<section class="group-type-section" *ngIf="mode === 'create'">
  <h2 class="title-form">
    {{ 'GUESTS_FORM.GROUP_TYPE_TITLE' | translate }}
  </h2>

  <mat-radio-group [value]="selectedGroupType" (change)="selectGroupType($event.value)">
    <mat-radio-button value="solo">
      {{ 'GUESTS_FORM.GROUP_TYPES.SOLO' | translate }}
    </mat-radio-button>

    <mat-radio-button value="couple">
      {{ 'GUESTS_FORM.GROUP_TYPES.COUPLE' | translate }}
    </mat-radio-button>

    <mat-radio-button value="friends">
      {{ 'GUESTS_FORM.GROUP_TYPES.FRIENDS' | translate }}
    </mat-radio-button>

    <mat-radio-button value="family">
      {{ 'GUESTS_FORM.GROUP_TYPES.FAMILY' | translate }}
    </mat-radio-button>
  </mat-radio-group>
</section>

<!-- Form -->
<section *ngIf="selectedGroupType">
  <!-- Trip -->
  <app-trip-form [trip]="guest || group?.[0]"></app-trip-form>

  <!-- CREATE -->
  <ng-container *ngIf="mode === 'create'">
    <app-guest-form
      *ngFor="let form of [].constructor(formsToShow)"
      [selectedGroupType]="selectedGroupType"
    ></app-guest-form>
  </ng-container>

  <!-- EDIT -->
  <ng-container *ngIf="mode === 'edit'">
    <app-guest-form *ngIf="guest" [guest]="guest" [selectedGroupType]="selectedGroupType"></app-guest-form>

    <app-guest-form
      *ngFor="let member of group"
      [guest]="member"
      [selectedGroupType]="selectedGroupType"
    ></app-guest-form>
  </ng-container>

  <!-- Add Guest -->
  <button
    id="btn-add-guest"
    *ngIf="mode === 'create' && (selectedGroupType === 'friends' || selectedGroupType === 'family')"
    type="button"
    mat-stroked-button
    (click)="addGuestForm()"
  >
    {{ 'GUESTS_FORM.ADD_GUEST' | translate }}
  </button>

  <!-- Submit -->
  <button id="btn-create-guest" type="button" mat-raised-button [disabled]="wasFormSubmitted" (click)="submit()">
    <mat-icon
      *ngIf="wasFormSubmitted"
      class="material-symbols-outlined loading-animation"
      fontIcon="refresh"
    ></mat-icon>

    {{ (mode === 'create' ? 'GUESTS_FORM.CREATE' : 'GUESTS_FORM.UPDATE') | translate }}
  </button>
</section>
