<div *ngIf="vm$ | async as vm">
  <sh-title [titleTxt]="'STATS.TITLE' | translate"></sh-title>

  <h1 *ngIf="vm.status === 'error'">{{ vm.error?.message }}</h1>

  <div class="ctn-buttons">
    <button
      *ngFor="let item of navItems"
      [attr.aria-label]="'STATS.NAV.' + item.chart.toUpperCase() | translate"
      [matTooltip]="'STATS.NAV.' + item.chart.toUpperCase() | translate"
      mat-icon-button
      [ngClass]="item.btnClass"
      [routerLink]="item.chart"
      routerLinkActive="active"
    >
      <mat-icon class="material-symbols-outlined">{{ item.icon }}</mat-icon>
    </button>
  </div>

  <app-loading
    *ngIf="vm.status === 'loading'"
    [messages]="[
      'STATS.LOADING.SUMMARY' | translate,
      'STATS.LOADING.ANALYZING' | translate,
      'STATS.LOADING.CHARTS' | translate,
      'STATS.LOADING.READY' | translate,
    ]"
  ></app-loading>

  <!-- The chart routes are rendered only when the data is ready -->
  <div class="ctn-content" *ngIf="vm.status === 'success'">
    <router-outlet></router-outlet>
  </div>
</div>
