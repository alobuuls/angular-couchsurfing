<div class="timeline-charts">
  <stats-view-switcher
    [views]="timelineViews"
    [selected]="selectedView"
    labelPrefix="STATS.TIMELINE.VIEWS."
    (selectedChange)="selectView($event)"
  />

  <div class="timeline-chart-ctn">
    <!-- Years / months / days / same arrival day -->
    <bar-chart
      *ngIf="barVm as vm"
      [title]="vm.title"
      [labels]="vm.labels"
      [values]="vm.values"
      [colors]="vm.colors"
      [legend]="vm.legend"
      [height]="vm.height"
      [valueAxisTitle]="vm.valueAxisTitle"
      (itemClick)="onBarClick($event)"
    ></bar-chart>

    <!-- Same stay -->
    <network-chart
      *ngIf="networkVm as vm"
      [title]="vm.title"
      [labels]="vm.labels"
      [edges]="vm.edges"
      [nodeColors]="vm.colors"
      [tooltip]="getNetworkTooltip"
      (itemClick)="onNetworkClick($event)"
    ></network-chart>
  </div>
</div>
