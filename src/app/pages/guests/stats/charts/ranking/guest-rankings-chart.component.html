<div class="ranking-charts">
  <!-- Ranking views -->
  <stats-view-switcher
    [views]="rankingViews"
    [selected]="selectedView"
    labelPrefix="STATS.RANKINGS.VIEWS."
    (selectedChange)="selectView($event)"
  />

  <!-- Subviews: overall / solo, or the group types -->
  <stats-view-switcher
    size="small"
    containerClass="ctn-buttons group-buttons"
    [views]="viewConfig[selectedView].subviews"
    [selected]="selectedSubview"
    [labelPrefix]="viewConfig[selectedView].subviewKeyPrefix"
    (selectedChange)="selectSubview($event)"
  />

  <!-- Ranking chart -->
  <div class="ranking-chart-row">
    <div class="ranking-chart-ctn">
      <bar-chart
        *ngIf="chartVm as vm"
        [datasetLabel]="vm.datasetLabel"
        [labels]="vm.labels"
        [values]="vm.values"
        [colors]="vm.colors"
        [valueMin]="0"
        [valueMax]="vm.max"
        [valueTickFormatter]="vm.tickFormatter"
        [valueAxisTitle]="'STATS.RANKINGS.LABELS.RANKING_POSITION' | translate"
        [tooltip]="rankingTooltip"
        (itemClick)="onChartClick($event)"
      ></bar-chart>
    </div>
  </div>
</div>
