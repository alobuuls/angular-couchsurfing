<div class="stays-charts">
  <!-- Stays views -->
  <div class="ctn-buttons">
    <button
      type="button"
      *ngFor="let view of staysViews"
      (click)="selectView(view)"
      [class.active]="selectedView === view"
      class="stats-nav-btns"
    >
      {{ 'STATS.STAYS.VIEWS.' + view.toUpperCase() | translate }}
    </button>
  </div>

  <!-- Longest / Shortest views -->
  <div class="ctn-buttons" *ngIf="selectedView === 'longest' || selectedView === 'shortest'">
    <button
      type="button"
      *ngFor="let view of stayViews"
      (click)="selectStayView(view)"
      [class.active]="selectedStayView === view"
      class="stats-nav-btns-small"
    >
      {{ 'STATS.STAYS.SUBVIEWS.' + view.toUpperCase() | translate }}
    </button>
  </div>

  <!-- Same Dates groups -->
  <div class="ctn-buttons" *ngIf="selectedView === 'sameDates' && stays?.sameDates?.length">
    <button
      type="button"
      *ngFor="let group of stays.sameDates; let i = index"
      (click)="selectSameDatesGroup(i)"
      [class.active]="selectedSameDatesGroup === i"
      class="stats-nav-btns-small"
    >
      {{ 'STATS.STAYS.GROUP' | translate }} {{ i + 1 }}
    </button>
  </div>

  <!-- Stays chart -->
  <div class="stays-chart-row">
    <div class="stays-chart-ctn">
      <!-- Longest / Shortest -->
      <polar-area-chart
        *ngIf="polarVm as polar"
        [maintainAspectRatio]="false"
        [title]="polar.title"
        [datasetLabel]="polar.title"
        [labels]="polar.labels"
        [values]="polar.values"
        [colors]="polar.colors"
        [tooltip]="getPolarTooltip"
        (itemClick)="onPolarClick($event)"
      ></polar-area-chart>

      <!-- Max people together -->
      <bar-chart
        *ngIf="maxPeopleVm as max"
        [horizontal]="false"
        [maintainAspectRatio]="false"
        [showLegend]="false"
        [title]="max.title"
        [datasetLabel]="max.title"
        [labels]="max.labels"
        [values]="max.values"
        [colors]="max.colors"
        [valueAxisTitle]="max.valueAxisTitle"
        [categoryAxisTitle]="max.categoryAxisTitle"
        [valueStep]="1"
        [valuePrecision]="0"
        [tooltip]="getMaxPeopleTooltip"
        (itemClick)="onMaxPeopleClick($event)"
      ></bar-chart>

      <!-- Same arrival -->
      <bar-chart
        *ngIf="arrivalVm as arrival"
        [maintainAspectRatio]="false"
        [title]="arrival.title"
        [datasetLabel]="arrival.datasetLabel"
        [labels]="arrival.labels"
        [values]="arrival.values"
        [colors]="arrival.colors"
        [legend]="arrival.legend"
        [valueAxisTitle]="arrival.valueAxisTitle"
        [categoryAxisTitle]="arrival.categoryAxisTitle"
        [valueStep]="1"
        [valuePrecision]="0"
        [tooltip]="getArrivalTooltip"
        (itemClick)="onArrivalClick($event)"
      ></bar-chart>

      <!-- Same dates -->
      <network-chart
        *ngIf="networkVm as network"
        [maintainAspectRatio]="false"
        [title]="network.title"
        [labels]="network.labels"
        [edges]="network.edges"
        [nodeColors]="network.colors"
        [legend]="network.legend"
        [pointRadius]="10"
        [tooltip]="getNetworkTooltip"
        (itemClick)="onNetworkClick($event)"
      ></network-chart>
    </div>
  </div>
</div>
