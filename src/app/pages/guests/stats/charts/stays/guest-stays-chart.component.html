<div class="stays-charts">
  <!-- Main views -->
  <stats-view-switcher
    [views]="staysViews"
    [selected]="selectedView"
    labelPrefix="STATS.STAYS.VIEWS."
    (selectedChange)="selectView($event)"
  />

  <!-- Longest / shortest subviews -->
  <stats-view-switcher
    *ngIf="selectedView === 'longest' || selectedView === 'shortest'"
    size="small"
    [views]="stayViews"
    [labels]="{
      overall: 'STATS.STAYS.LABELS.OVERALL',
      solo: 'STATS.COMMON.GROUP_TYPES.SOLO',
      couple: 'STATS.COMMON.GROUP_TYPES.COUPLE',
      friends: 'STATS.COMMON.GROUP_TYPES.FRIENDS',
      family: 'STATS.COMMON.GROUP_TYPES.FAMILY',
    }"
    [selected]="selectedStayView"
    (selectedChange)="selectStayView($event)"
  />

  <!-- Same dates: one button per group -->
  <div class="ctn-buttons group-buttons" *ngIf="selectedView === 'sameDates' && stays?.sameDates?.length">
    <button
      type="button"
      *ngFor="let group of stays.sameDates; let i = index"
      class="stats-nav-btns-small"
      [class.active]="selectedSameDatesGroup === i"
      (click)="selectSameDatesGroup(i)"
    >
      {{ i + 1 }}
    </button>
  </div>

  <div class="stays-chart-ctn">
    <!-- Longest / shortest -->
    <polar-area-chart
      *ngIf="polarVm as vm"
      [title]="vm.title"
      [labels]="vm.labels"
      [values]="vm.values"
      [colors]="vm.colors"
      [tooltip]="getPolarTooltip"
      (itemClick)="onPolarClick($event)"
    ></polar-area-chart>

    <!-- Maximum guests together -->
    <bar-chart
      *ngIf="maxPeopleVm as vm"
      [title]="vm.title"
      [labels]="vm.labels"
      [values]="vm.values"
      [colors]="vm.colors"
      [horizontal]="false"
      [showLegend]="false"
      [valueMin]="0"
      [valuePrecision]="0"
      [valueAxisTitle]="vm.valueAxisTitle"
      [categoryAxisTitle]="vm.categoryAxisTitle"
      [tooltip]="getMaxPeopleTooltip"
      (itemClick)="onMaxPeopleClick($event)"
    ></bar-chart>

    <!-- Same arrival -->
    <bar-chart
      *ngIf="arrivalVm as vm"
      [title]="vm.title"
      [datasetLabel]="vm.datasetLabel"
      [labels]="vm.labels"
      [values]="vm.values"
      [colors]="vm.colors"
      [legend]="vm.legend"
      [horizontal]="false"
      [valueMin]="0"
      [valuePrecision]="0"
      [valueAxisTitle]="vm.valueAxisTitle"
      [categoryAxisTitle]="vm.categoryAxisTitle"
      [tooltip]="getArrivalTooltip"
      (itemClick)="onArrivalClick($event)"
    ></bar-chart>

    <!-- Same dates -->
    <network-chart
      *ngIf="networkVm as vm"
      [title]="vm.title"
      [labels]="vm.labels"
      [edges]="vm.edges"
      [nodeColors]="vm.colors"
      [legend]="vm.legend"
      [tooltip]="getNetworkTooltip"
      (itemClick)="onNetworkClick($event)"
    ></network-chart>
  </div>
</div>
