<div class="demographics-charts">
  <!-- Demographics views -->
  <div class="ctn-buttons">
    <button
      type="button"
      *ngFor="let view of demographicsViews"
      (click)="selectView(view)"
      [class.active]="selectedView === view"
      class="stats-nav-btns"
    >
      {{ demographicsViewLabels[view] | translate }}
    </button>
  </div>

  <!-- Totals views -->
  <div class="ctn-buttons" *ngIf="selectedView === 'totals'">
    <button
      type="button"
      *ngFor="let view of demographicTotalsViews"
      (click)="selectTotalsView(view)"
      [class.active]="selectedTotalsView === view"
      class="stats-nav-btns-small"
    >
      {{ getSubViewLabel(view) }}
    </button>
  </div>

  <!-- Age-based views -->
  <div class="ctn-buttons" *ngIf="selectedView === 'oldest' || selectedView === 'youngest'">
    <button
      type="button"
      *ngFor="let view of demographicAgeViews"
      (click)="selectAgeView(view)"
      [class.active]="selectedAgeView === view"
      class="stats-nav-btns-small"
    >
      {{ getSubViewLabel(view) }}
    </button>
  </div>

  <!-- First/Last views -->
  <div class="ctn-buttons" *ngIf="selectedView === 'firstLast'">
    <button
      type="button"
      *ngFor="let view of demographicFirstLastViews"
      (click)="selectFirstLastView(view)"
      [class.active]="selectedFirstLastView === view"
      class="stats-nav-btns-small"
    >
      {{ getSubViewLabel(view) }}
    </button>
  </div>

  <!-- Chart -->
  <div class="demographics-chart-row">
    <div class="demographics-chart-ctn">
      <canvas #demographicsChart></canvas>
    </div>
  </div>
</div>
