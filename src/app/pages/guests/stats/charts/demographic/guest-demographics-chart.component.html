<div class="demographics-charts">
  <!-- Main views -->
  <stats-view-switcher
    [views]="demographicsViews"
    [labels]="demographicsViewLabels"
    [selected]="selectedView"
    (selectedChange)="selectView($event)"
  />

  <!-- Totals subviews -->
  <stats-view-switcher
    *ngIf="selectedView === 'totals'"
    size="small"
    [views]="demographicTotalsViews"
    [selected]="selectedTotalsView"
    labelPrefix="STATS.DEMOGRAPHICS.SUBVIEWS."
    (selectedChange)="selectTotalsView($event)"
  />

  <!-- Oldest / youngest subviews -->
  <stats-view-switcher
    *ngIf="selectedView === 'oldest' || selectedView === 'youngest'"
    size="small"
    [views]="demographicAgeViews"
    [selected]="selectedAgeView"
    labelPrefix="STATS.DEMOGRAPHICS.SUBVIEWS."
    (selectedChange)="selectAgeView($event)"
  />

  <!-- First / last subviews -->
  <stats-view-switcher
    *ngIf="selectedView === 'firstLast'"
    size="small"
    [views]="demographicFirstLastViews"
    [selected]="selectedFirstLastView"
    labelPrefix="STATS.DEMOGRAPHICS.SUBVIEWS."
    (selectedChange)="selectFirstLastView($event)"
  />

  <div class="demographics-chart-ctn">
    <!-- Totals: overall -->
    <pie-chart
      *ngIf="pieVm as vm"
      [datasetLabel]="vm.datasetLabel"
      [labels]="vm.labels"
      [values]="vm.values"
      [colors]="vm.colors"
      (itemClick)="onPieClick($event)"
    ></pie-chart>

    <!-- Totals: groups -->
    <bar-chart
      *ngIf="groupsBarVm as vm"
      [labels]="vm.labels"
      [series]="vm.series"
      [horizontal]="false"
      [valuePrecision]="0"
      [categoryAxisTitle]="groupTitle"
      (elementClick)="onGroupsBarClick($event)"
    ></bar-chart>

    <!-- Oldest / youngest: overall -->
    <bar-chart
      *ngIf="rankingBarVm as vm"
      [datasetLabel]="vm.datasetLabel"
      [labels]="vm.labels"
      [values]="vm.values"
      [colors]="vm.colors"
      [legend]="vm.legend"
      [valueAxisTitle]="ageTitle"
      [tooltip]="getRankingTooltip"
      (itemClick)="onRankingClick($event)"
    ></bar-chart>

    <!-- Oldest / youngest: solo -->
    <scatter-chart
      *ngIf="scatterVm as vm"
      xType="time"
      yType="linear"
      [dateLocale]="dateLocale"
      [datasetLabel]="vm.datasetLabel"
      [points]="vm.points"
      [colors]="vm.colors"
      [legend]="vm.legend"
      [xTitle]="visitDateTitle"
      [yTitle]="ageTitle"
      [pointRadius]="8"
      [pointHoverRadius]="11"
      [tooltip]="getScatterTooltip"
      (itemClick)="onScatterClick($event)"
    ></scatter-chart>

    <!-- Oldest / youngest: groups -->
    <bubble-chart
      *ngIf="bubbleVm as vm"
      [datasetLabel]="vm.datasetLabel"
      [points]="vm.points"
      [colors]="vm.colors"
      [legend]="vm.legend"
      [xTitle]="ageTitle"
      [yTitle]="groupTitle"
      [xStep]="5"
      [yMin]="0"
      [yMax]="4"
      [yTickFormatter]="groupTickFormatter"
      [padding]="20"
      [tooltip]="getBubbleTooltip"
      (itemClick)="onBubbleClick($event)"
    ></bubble-chart>

    <!-- First / last -->
    <scatter-chart
      *ngIf="firstLastVm as vm"
      xType="time"
      yType="category"
      [dateLocale]="dateLocale"
      [series]="vm.series"
      [yLabels]="vm.yLabels"
      [legend]="vm.legend"
      [xTitle]="visitDateTitle"
      [yTitle]="vm.yTitle"
      [tooltip]="getFirstLastTooltip"
      (elementClick)="onFirstLastClick($event)"
    ></scatter-chart>
  </div>
</div>
