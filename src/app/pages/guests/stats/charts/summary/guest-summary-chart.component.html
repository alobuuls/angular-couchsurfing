<div class="summary-charts">
  <!-- Summary views -->
  <div class="ctn-buttons">
    <button
      type="button"
      *ngFor="let view of summaryViews"
      (click)="selectView(view)"
      [class.active]="selectedView === view"
      class="stats-nav-btns"
    >
      {{ 'STATS.SUMMARY.VIEWS.' + view.toUpperCase() | translate }}
    </button>
  </div>

  <!-- Total -->
  <div *ngIf="selectedView === 'total'">
    <div class="summary-cards">
      <div class="summary-card" *ngFor="let card of cards; trackBy: trackById">
        <button
          mat-icon-button
          [attr.aria-label]="getCardTranslationKey(card.label) | translate"
          [matTooltip]="
            ('STATS.SUMMARY.CARDS.VIEW' | translate) + ' ' + (getCardTranslationKey(card.label) | translate)
          "
          class="icon-summary-card"
          (click)="navigateToCard(card.label)"
        >
          <mat-icon class="material-symbols-outlined">
            {{ card.icon }}
          </mat-icon>
        </button>

        <div class="ctn-summary-card">
          <span class="value-summary-card">
            {{ card.value }}
          </span>

          <span class="label-summary-card">
            {{ getCardTranslationKey(card.label) | translate }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <canvas *ngIf="selectedView !== 'total'" #summaryChart></canvas>
</div>
