<div class="summary-charts">
  <!-- Summary views -->
  <stats-view-switcher
    [views]="summaryViews"
    [selected]="selectedView"
    labelPrefix="STATS.SUMMARY.VIEWS."
    (selectedChange)="selectView($event)"
  />

  <!-- Total: summary cards -->
  <div class="summary-cards" *ngIf="selectedView === 'total'">
    <button
      type="button"
      class="summary-card"
      *ngFor="let card of cards; trackBy: trackByKey"
      (click)="navigateToCard(card)"
    >
      <mat-icon class="material-symbols-outlined">{{ card.icon }}</mat-icon>
      <span class="summary-card-value">{{ card.value }}</span>
      <span class="summary-card-label">{{ 'STATS.SUMMARY.CARDS.' + card.key | translate }}</span>
    </button>
  </div>

  <!-- Nights / rating: radar chart -->
  <div class="summary-chart-ctn" *ngIf="radarVm as vm">
    <radar-chart
      [datasetLabel]="vm.datasetLabel"
      [labels]="vm.labels"
      [values]="vm.values"
      [min]="0"
      [max]="vm.max"
      [step]="1"
      [colors]="vm.colors"
      [pointColors]="vm.pointColors"
      [tooltip]="getRadarTooltip"
    ></radar-chart>
  </div>

  <!-- Gifts: doughnut chart -->
  <div class="summary-chart-ctn" *ngIf="doughnutVm as vm">
    <pie-chart
      variant="doughnut"
      [padding]="20"
      [datasetLabel]="vm.datasetLabel"
      [labels]="vm.labels"
      [values]="vm.values"
      [colors]="vm.colors"
      [tooltip]="getDoughnutTooltip"
      (itemClick)="onGiftClick($event)"
    ></pie-chart>
  </div>
</div>
