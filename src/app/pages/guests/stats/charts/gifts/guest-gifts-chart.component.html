<div class="gifts-charts">
  <!-- Gifts views -->
  <div class="ctn-buttons">
    <button
      type="button"
      *ngFor="let view of giftsViews"
      (click)="selectView(view)"
      [class.active]="selectedView === view"
      class="stats-nav-btns"
    >
      {{ giftsViewLabels[view] | translate }}
    </button>
  </div>

  <!-- Gifts chart -->
  <div class="gifts-chart-row">
    <div class="gifts-chart-ctn">
      <polar-area-chart
        *ngIf="vm as chart"
        [title]="chart.title"
        [datasetLabel]="chart.title"
        [labels]="chart.labels"
        [values]="chart.values"
        [colors]="chart.colors"
        [height]="chart.height"
        [tooltip]="getTooltip"
        (itemClick)="onItemClick($event)"
      />
    </div>
  </div>
</div>
