<div class="gifts-charts">
  <stats-view-switcher
    [views]="giftsViews"
    [selected]="selectedView"
    labelPrefix="STATS.GIFTS.VIEWS."
    (selectedChange)="selectView($event)"
  />

  <div class="gifts-chart-ctn">
    <pie-chart
      *ngIf="vm"
      [title]="vm.title"
      [labels]="vm.labels"
      [values]="vm.values"
      [colors]="vm.colors"
      [height]="vm.height"
      [showLegend]="false"
      [tooltip]="getTooltip"
      (itemClick)="onItemClick($event)"
    ></pie-chart>
  </div>
</div>
