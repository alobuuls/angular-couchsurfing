<div class="geography-charts">
  <!-- Geography views -->
  <div class="ctn-buttons">
    <button
      type="button"
      *ngFor="let view of geographyViews"
      (click)="selectView(view)"
      [class.active]="selectedView === view"
      class="stats-nav-btns"
    >
      {{ geographyViewLabels[view] | translate }}
    </button>
  </div>

  <!-- Ranking views -->
  <div class="ctn-ranking-buttons">
    <!-- General rankings -->
    <ng-container *ngIf="selectedView !== 'continents' && selectedView !== 'livingIn' && selectedView !== 'hometown'">
      <button
        type="button"
        *ngFor="let ranking of rankingViews"
        (click)="selectRanking(ranking)"
        [class.active]="selectedRanking === ranking"
        class="stats-nav-btns-small"
      >
        {{
          ranking === 'all'
            ? ('STATS.GEOGRAPHY.RANKINGS.ALL' | translate)
            : ranking === 'top'
              ? ('STATS.GEOGRAPHY.RANKINGS.TOP' | translate)
              : ('STATS.GEOGRAPHY.RANKINGS.BOTTOM' | translate)
        }}
      </button>
    </ng-container>

    <!-- Country-specific rankings -->
    <ng-container *ngIf="selectedView === 'countries'">
      <button
        type="button"
        *ngFor="let ranking of countryRankingViews"
        (click)="selectRanking(ranking)"
        [class.active]="selectedRanking === ranking"
        class="stats-nav-btns-small"
      >
        {{
          ranking === 'topFemale'
            ? ('STATS.GEOGRAPHY.RANKINGS.TOP_FEMALE' | translate)
            : ranking === 'topMale'
              ? ('STATS.GEOGRAPHY.RANKINGS.TOP_MALE' | translate)
              : ('STATS.GEOGRAPHY.RANKINGS.MOST_CONSECUTIVE' | translate)
        }}
      </button>
    </ng-container>
  </div>

  <!-- Geography chart -->
  <div class="geography-chart-row">
    <div class="geography-chart-ctn">
      <!-- Pie / bar charts -->
      <ng-container *ngIf="chartVm as vm" [ngSwitch]="vm.type">
        <pie-chart
          *ngSwitchCase="'pie'"
          [title]="vm.title"
          [datasetLabel]="vm.datasetLabel"
          [labels]="vm.labels"
          [values]="vm.values"
          [colors]="vm.colors"
          [legend]="vm.legend"
          (itemClick)="onChartClick($event)"
        />

        <bar-chart
          *ngSwitchCase="'bar'"
          [title]="vm.title"
          [datasetLabel]="vm.datasetLabel"
          [labels]="vm.labels"
          [values]="vm.values"
          [colors]="vm.colors"
          [legend]="vm.legend"
          [height]="vm.height"
          [valueAxisTitle]="'STATS.GEOGRAPHY.LABELS.NUMBER_OF_GUESTS' | translate"
          (itemClick)="onChartClick($event)"
        />
      </ng-container>

      <!-- Most consecutive -->
      <scatter-chart
        *ngIf="consecutiveVm as vm"
        [title]="vm.title"
        [points]="vm.points"
        [colors]="vm.colors"
        [legend]="vm.legend"
        [height]="vm.height"
        [xMin]="vm.xMin"
        [xMax]="vm.xMax"
        [xTitle]="'STATS.GEOGRAPHY.LABELS.VISIT_DATE' | translate"
        [yTitle]="'STATS.GEOGRAPHY.LABELS.GUESTS' | translate"
        [xTickFormatter]="consecutiveTickFormatter"
        [tooltip]="consecutiveTooltip"
        (itemClick)="onConsecutiveClick($event)"
      />
    </div>

    <!-- Country labels with flags -->
    <div
      *ngIf="selectedView === 'countries' || selectedView === 'livingIn' || selectedView === 'hometown'"
      class="country-labels"
      [class.ranking-labels]="selectedRanking !== 'all' || selectedView === 'livingIn' || selectedView === 'hometown'"
    >
      <div *ngFor="let country of chartVm?.items" class="country-label">
        <span [class]="country.code | flag"></span>
      </div>
    </div>
  </div>
</div>
