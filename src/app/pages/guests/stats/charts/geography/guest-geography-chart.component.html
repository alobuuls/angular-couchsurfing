<div class="geography-charts">
  <!-- Geography views -->
  <div class="ctn-buttons">
    <button
      type="button"
      *ngFor="let view of geographyViews"
      (click)="selectView(view)"
      [class.active]="selectedView === view"
      class="stats-nav-btns"
    >
      {{ geographyViewLabels[view] | translate }}
    </button>
  </div>

  <!-- Ranking views -->
  <div class="ctn-ranking-buttons">
    <!-- General rankings -->
    <ng-container *ngIf="selectedView !== 'continents' && selectedView !== 'livingIn' && selectedView !== 'hometown'">
      <button
        type="button"
        *ngFor="let ranking of rankingViews"
        (click)="selectRanking(ranking)"
        [class.active]="selectedRanking === ranking"
        class="stats-nav-btns-small"
      >
        {{
          ranking === 'all'
            ? ('STATS.GEOGRAPHY.RANKINGS.ALL' | translate)
            : ranking === 'top'
              ? ('STATS.GEOGRAPHY.RANKINGS.TOP' | translate)
              : ('STATS.GEOGRAPHY.RANKINGS.BOTTOM' | translate)
        }}
      </button>
    </ng-container>

    <!-- Country-specific rankings -->
    <ng-container *ngIf="selectedView === 'countries'">
      <button
        type="button"
        *ngFor="let ranking of countryRankingViews"
        (click)="selectRanking(ranking)"
        [class.active]="selectedRanking === ranking"
        class="stats-nav-btns-small"
      >
        {{
          ranking === 'topFemale'
            ? ('STATS.GEOGRAPHY.RANKINGS.TOP_FEMALE' | translate)
            : ranking === 'topMale'
              ? ('STATS.GEOGRAPHY.RANKINGS.TOP_MALE' | translate)
              : ('STATS.GEOGRAPHY.RANKINGS.MOST_CONSECUTIVE' | translate)
        }}
      </button>
    </ng-container>
  </div>

  <!-- Geography chart -->
  <div class="geography-chart-row">
    <div class="geography-chart-ctn">
      <canvas #geographyChart></canvas>
    </div>
    <!-- Country labels with flags -->
    <div *ngIf="selectedView === 'countries'" class="country-labels" [class.ranking-labels]="selectedRanking !== 'all'">
      <div *ngFor="let country of getSelectedCountries()" class="country-label">
        <span [class]="country.code | flag"></span>
      </div>
    </div>
  </div>
</div>
