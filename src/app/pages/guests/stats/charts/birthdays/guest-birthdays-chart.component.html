<div class="birthdays-charts">
  <stats-view-switcher
    [views]="birthdaysViews"
    [selected]="selectedView"
    labelPrefix="STATS.BIRTHDAYS.VIEWS."
    (selectedChange)="selectView($event)"
  />

  <div class="birthdays-chart-ctn">
    <!-- Calendar -->
    <heatmap-chart
      *ngIf="heatmapVm as vm"
      [title]="vm.title"
      [datasetLabel]="vm.datasetLabel"
      [cells]="vm.cells"
      [xLabels]="vm.xLabels"
      [yLabels]="vm.yLabels"
      [xTitle]="monthAxisTitle"
      [yTitle]="dayAxisTitle"
      [padding]="chartPadding"
      [cellColor]="calendarCellColor"
      [cellBorderColor]="cellBorderColor"
      [height]="heatmapHeight"
      [tooltip]="getCalendarTooltip"
      (itemClick)="onCalendarClick($event)"
    ></heatmap-chart>

    <!-- Repeated -->
    <bubble-chart
      *ngIf="bubbleVm as vm"
      [title]="vm.title"
      [datasetLabel]="vm.datasetLabel"
      [points]="vm.points"
      [colors]="vm.colors"
      [xTitle]="monthAxisTitle"
      [yTitle]="dayAxisTitle"
      [xMin]="0"
      [xMax]="13"
      [yMin]="0"
      [yMax]="32"
      [xTickFormatter]="monthTickFormatter"
      [yTickFormatter]="dayTickFormatter"
      [padding]="chartPadding"
      [tooltip]="getRepeatedTooltip"
      [height]="bubbleHeight"
      (itemClick)="onRepeatedClick($event)"
    ></bubble-chart>

    <!-- Unusual -->
    <line-chart
      *ngIf="lineVm as vm"
      [title]="vm.title"
      [datasetLabel]="vm.datasetLabel"
      [points]="vm.points"
      [colors]="vm.colors"
      [xTitle]="monthAxisTitle"
      [yTitle]="dayAxisTitle"
      [xMin]="0"
      [xMax]="13"
      [yMin]="0"
      [yMax]="32"
      [xTickFormatter]="monthTickFormatter"
      [yTickFormatter]="dayTickFormatter"
      [padding]="chartPadding"
      [tooltip]="getUnusualTooltip"
      [height]="lineHeight"
      (itemClick)="onUnusualClick($event)"
    ></line-chart>
  </div>
</div>
