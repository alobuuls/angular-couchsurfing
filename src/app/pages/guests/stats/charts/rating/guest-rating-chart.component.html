<div class="rating-charts">
  <!-- Main Rating views -->
  <div class="ctn-buttons">
    <button
      type="button"
      *ngFor="let view of ratingMainViews"
      (click)="selectMainView(view)"
      [class.active]="selectedMainView === view"
      class="stats-nav-btns"
    >
      {{ 'STATS.RATINGS.VIEWS.' + view.toUpperCase() | translate }}
    </button>
  </div>

  <!-- Rating group views -->
  <div class="ctn-buttons">
    <button
      type="button"
      *ngFor="let view of ratingViews"
      (click)="selectView(view)"
      [class.active]="selectedView === view"
      class="stats-nav-btns-small"
    >
      {{ 'STATS.RATINGS.GROUP_TYPES.' + view.toUpperCase() | translate }}
    </button>
  </div>

  <!-- Chart + type buttons -->
  <div class="chart-row" [class.pie-chart-row]="selectedChart === 'doughnut' && selectedMainView === 'distribution'">
    <!-- Rating chart -->
    <!-- Rating chart -->
    <div
      class="rating-charts-ctn"
      [class.pie-chart]="selectedChart === 'doughnut' && selectedMainView === 'distribution'"
    >
      <!-- Distribution -->
      <ng-container *ngIf="distributionVm as vm">
        <bar-chart
          *ngIf="selectedChart !== 'doughnut'"
          [datasetLabel]="vm.datasetLabel"
          [labels]="vm.labels"
          [values]="vm.values"
          [colors]="vm.colors"
          [horizontal]="false"
          [maintainAspectRatio]="false"
          [datasetLabelInTooltip]="true"
          (itemClick)="onDistributionClick($event)"
        />

        <pie-chart
          *ngIf="selectedChart === 'doughnut'"
          variant="doughnut"
          [padding]="20"
          [datasetLabel]="vm.datasetLabel"
          [labels]="vm.labels"
          [values]="vm.values"
          [colors]="vm.colors"
          [maintainAspectRatio]="false"
          [datasetLabelInTooltip]="true"
          (itemClick)="onDistributionClick($event)"
        />
      </ng-container>

      <!-- Lowest / Highest -->
      <dot-plot-chart
        *ngIf="dotPlotVm as vm"
        [datasetLabel]="vm.datasetLabel"
        [labels]="vm.labels"
        [values]="vm.values"
        [colors]="vm.colors"
        [yMin]="0"
        [yMax]="5.5"
        [yTickMax]="5"
        [yTickFormatter]="starTickFormatter"
        [xTitle]="'STATS.RATINGS.LABELS.GUESTS' | translate"
        [yTitle]="'STATS.RATINGS.LABELS.RATING' | translate"
        [maintainAspectRatio]="false"
        [tooltip]="dotTooltip"
        (itemClick)="onDotClick($event)"
      />
    </div>

    <!-- Distribution chart type buttons -->
    <div class="ctn-chart-types" *ngIf="selectedMainView === 'distribution'">
      <!-- Bar chart -->
      <button
        mat-icon-button
        class="btn-type-chart"
        type="button"
        (click)="selectChartType('bar')"
        [class.active]="selectedChart === 'bar'"
      >
        <mat-icon class="material-symbols-outlined">bar_chart</mat-icon>
      </button>

      <!-- Doughnut chart -->
      <button
        mat-icon-button
        class="btn-type-chart"
        type="button"
        (click)="selectChartType('doughnut')"
        [class.active]="selectedChart === 'doughnut'"
      >
        <mat-icon class="material-symbols-outlined">pie_chart</mat-icon>
      </button>
    </div>
  </div>
</div>
