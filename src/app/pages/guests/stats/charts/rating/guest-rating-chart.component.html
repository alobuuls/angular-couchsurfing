<div class="rating-charts">
  <!-- Main Rating views -->
  <stats-view-switcher
    [views]="ratingMainViews"
    [selected]="selectedMainView"
    labelPrefix="STATS.RATINGS.VIEWS."
    (selectedChange)="selectMainView($event)"
  />

  <!-- Rating group views -->
  <stats-view-switcher
    size="small"
    [views]="ratingViews"
    [selected]="selectedView"
    labelPrefix="STATS.RATINGS.GROUP_TYPES."
    (selectedChange)="selectView($event)"
  />

  <!-- Chart + type buttons -->
  <div class="chart-row" [class.pie-chart-row]="selectedChart === 'doughnut' && selectedMainView === 'distribution'">
    <!-- Rating chart -->
    <div
      class="rating-charts-ctn"
      [class.pie-chart]="selectedChart === 'doughnut' && selectedMainView === 'distribution'"
    >
      <!-- Distribution -->
      <ng-container *ngIf="distributionVm as vm">
        <bar-chart
          *ngIf="selectedChart !== 'doughnut'"
          [datasetLabel]="vm.datasetLabel"
          [labels]="vm.labels"
          [values]="vm.values"
          [colors]="vm.colors"
          [horizontal]="false"
          [maintainAspectRatio]="false"
          [datasetLabelInTooltip]="true"
          (itemClick)="onDistributionClick($event)"
        ></bar-chart>

        <pie-chart
          *ngIf="selectedChart === 'doughnut'"
          variant="doughnut"
          [padding]="20"
          [datasetLabel]="vm.datasetLabel"
          [labels]="vm.labels"
          [values]="vm.values"
          [colors]="vm.colors"
          [maintainAspectRatio]="false"
          [datasetLabelInTooltip]="true"
          (itemClick)="onDistributionClick($event)"
        ></pie-chart>
      </ng-container>

      <!-- Lowest / Highest -->
      <dot-plot-chart
        *ngIf="dotPlotVm as vm"
        [datasetLabel]="vm.datasetLabel"
        [labels]="vm.labels"
        [values]="vm.values"
        [colors]="vm.colors"
        [yMin]="0"
        [yMax]="5.5"
        [yTickMax]="5"
        [yTickFormatter]="starTickFormatter"
        [xTitle]="'STATS.RATINGS.LABELS.GUESTS' | translate"
        [yTitle]="'STATS.RATINGS.LABELS.RATING' | translate"
        [maintainAspectRatio]="false"
        [tooltip]="dotTooltip"
        (itemClick)="onDotClick($event)"
      ></dot-plot-chart>
    </div>

    <!-- Distribution chart type buttons -->
    <div class="ctn-chart-types" *ngIf="selectedMainView === 'distribution'">
      <button
        *ngFor="let chart of chartTypes"
        mat-icon-button
        class="btn-type-chart"
        type="button"
        [class.active]="selectedChart === chart.type"
        (click)="selectChartType(chart.type)"
      >
        <mat-icon class="material-symbols-outlined">{{ chart.icon }}</mat-icon>
      </button>
    </div>
  </div>
</div>
