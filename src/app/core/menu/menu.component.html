<header id="menu-flex" class="menu-flex">
  <nav class="menu">
    <div class="logo-menu">
      <a [routerLink]="['guests']" title="CouchSurfing">
        <span class="title-logo-menu">CouchSurfing</span>
      </a>

      <a href="javascript:void(0);" id="btn-menu" class="btn-menu">
        <mat-icon
          class="material-symbols-outlined"
          aria-hidden="false"
          aria-label="menu icon"
          fontIcon="menu"
        ></mat-icon>
      </a>
    </div>

    <div id="links" class="links">
      <!-- GUESTS -->
      <a [routerLink]="['guests']" routerLinkActive="links-menu-active" class="links-menu">
        <mat-icon
          aria-hidden="false"
          aria-label="guests icon"
          class="material-symbols-outlined"
          fontIcon="diversity_1"
        ></mat-icon>
        {{ 'MENU.GUESTS' | translate }}
      </a>

      <!-- HOSTED -->
      <a [routerLink]="['hosted']" routerLinkActive="links-menu-active" class="links-menu">
        <mat-icon
          aria-hidden="false"
          aria-label="hosted icon"
          class="material-symbols-outlined"
          fontIcon="home"
        ></mat-icon>
        {{ 'MENU.HOSTED' | translate }}
      </a>

      <!-- PERSONAL -->
      <a [routerLink]="['personal']" routerLinkActive="links-menu-active" class="links-menu">
        <mat-icon
          aria-hidden="false"
          aria-label="personal icon"
          class="material-symbols-outlined"
          fontIcon="person"
        ></mat-icon>
        {{ 'MENU.PERSONAL' | translate }}
      </a>

      <!-- THEME -->
      <button class="links-menu btn-theme" (click)="toggleTheme()" [attr.aria-label]="themeLabel">
        <mat-icon class="material-symbols-outlined icon-theme" aria-hidden="true" [fontIcon]="themeIcon"></mat-icon>
      </button>

      <!-- THEME SELECTION -->
      <div class="ctn-selection-theme">
        <button class="links-menu btn-tint" aria-label="Select color palette" (click)="toggleThemeSelection()">
          <mat-icon
            class="material-symbols-outlined icon-palette"
            [class.active]="showThemeSelection"
            aria-hidden="true"
            fontIcon="palette"
          ></mat-icon>
        </button>

        <div class="tints" [class.active]="showThemeSelection">
          <!-- Coastal Nomad -->
          <button
            class="btn-tint coastal"
            aria-label="Coastal Nomad palette"
            title="Coastal Nomad"
            [class.selected]="currentPalette === 'coastal'"
            (click)="selectPalette('coastal')"
          ></button>

          <!-- Ocean Blue -->
          <button
            class="btn-tint ocean"
            aria-label="Ocean Blue palette"
            title="Ocean Blue"
            [class.selected]="currentPalette === 'ocean'"
            (click)="selectPalette('ocean')"
          ></button>

          <!-- Pink Blossom -->
          <button
            class="btn-tint pink"
            aria-label="Pink Blossom palette"
            title="Pink Blossom"
            [class.selected]="currentPalette === 'pink'"
            (click)="selectPalette('pink')"
          ></button>

          <!-- Lavender Nomad -->
          <button
            class="btn-tint lavender"
            aria-label="Lavender Nomad palette"
            title="Lavender Nomad"
            [class.selected]="currentPalette === 'lavender'"
            (click)="selectPalette('lavender')"
          ></button>
        </div>
      </div>

      <!-- LANGUAGE -->
      <div class="ctn-selection-language">
        <button
          class="links-menu btn-language"
          aria-label="Select language"
          title="Select language"
          (click)="toggleLanguageSelection()"
        >
          <mat-icon class="material-symbols-outlined" aria-hidden="true" fontIcon="language"></mat-icon>

          <span>{{ currentLanguage.toUpperCase() }}</span>
        </button>

        <div class="languages" [class.active]="showLanguageSelection">
          <button
            class="btn-language-option"
            [class.selected]="currentLanguage === btnLang.selectedLang"
            (click)="selectLanguage(btnLang.selectedLang)"
            *ngFor="let btnLang of btnsLang"
          >
            <span [ngClass]="'fi fi-' + btnLang.flag"></span>
            {{ btnLang.translationKey | translate }}
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>
