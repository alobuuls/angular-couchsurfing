name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "NG_APP_KEY_CITIES=${{ secrets.NG_APP_KEY_CITIES }}" >> .env
          echo "NG_APP_KEY_CARTO=${{ secrets.NG_APP_KEY_CARTO }}" >> .env

      - name: Build Angular
        run: npm run build -- --configuration production --base-href /angular-couchsurfing/

      - name: Fix Angular routing
        run: cp ./dist/couchsurfing-app/index.html ./dist/couchsurfing-app/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/couchsurfing-app
