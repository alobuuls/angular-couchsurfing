services:
  front-cs-image-prod:
    image: front-cs-image-prod

    build:
      context: .
      dockerfile: Dockerfile
      target: production
      secrets:
        - env

    container_name: front-cs-container-prod
    restart: unless-stopped

    ports:
      - '8089:8080'

    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    networks:
      - cs_network_prod

secrets:
  env:
    file: .env

networks:
  cs_network_prod:
    name: cs_network_prod
    external: true
